<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woot - Checkout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="logo">WOOT</div>
    <nav class="nav">
      <span class="cart-icon" id="cart-icon">Cart (<span id="cart-count">0</span>)</span>
    </nav>
  </header>

  <main class="main">
    <!-- Step Progress Bar -->
    <div class="progress-bar" id="progress-bar">
      <div class="step active" data-step="1">
        <div class="step-number">1</div>
        <div class="step-label">Shop</div>
      </div>
      <div class="step-line"></div>
      <div class="step" data-step="2">
        <div class="step-number">2</div>
        <div class="step-label">Cart</div>
      </div>
      <div class="step-line"></div>
      <div class="step" data-step="3">
        <div class="step-number">3</div>
        <div class="step-label">Shipping</div>
      </div>
      <div class="step-line"></div>
      <div class="step" data-step="4">
        <div class="step-number">4</div>
        <div class="step-label">Payment</div>
      </div>
      <div class="step-line"></div>
      <div class="step" data-step="5">
        <div class="step-number">5</div>
        <div class="step-label">Confirm</div>
      </div>
    </div>

    <!-- Step 1: Products -->
    <section class="panel active" id="step-products">
      <h2>Today's Deals</h2>
      <div class="products-grid" id="products-grid"></div>
      <div class="panel-actions">
        <button class="btn btn-primary" id="btn-go-cart" disabled>View Cart</button>
      </div>
    </section>

    <!-- Step 2: Cart Review -->
    <section class="panel" id="step-cart">
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <div class="cart-summary" id="cart-summary"></div>
      <div class="panel-actions">
        <button class="btn btn-secondary" id="btn-back-products">Back to Shop</button>
        <button class="btn btn-primary" id="btn-go-shipping">Proceed to Shipping</button>
      </div>
    </section>

    <!-- Step 3: Shipping -->
    <section class="panel" id="step-shipping">
      <h2>Shipping Information</h2>
      <form id="shipping-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
          </div>
        </div>
        <div class="form-group">
          <label for="address">Street Address</label>
          <input type="text" id="address" name="address" placeholder="123 Main St" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Springfield" required>
          </div>
          <div class="form-group">
            <label for="state">State</label>
            <input type="text" id="state" name="state" placeholder="IL" required>
          </div>
          <div class="form-group">
            <label for="zip">ZIP Code</label>
            <input type="text" id="zip" name="zip" placeholder="62704" required>
          </div>
        </div>
        <div class="form-errors" id="shipping-errors"></div>
        <div class="panel-actions">
          <button type="button" class="btn btn-secondary" id="btn-back-cart">Back to Cart</button>
          <button type="submit" class="btn btn-primary">Continue to Payment</button>
        </div>
      </form>
    </section>

    <!-- Step 4: Payment -->
    <section class="panel" id="step-payment">
      <h2>Payment Information</h2>
      <form id="payment-form" novalidate>
        <div class="form-group">
          <label for="nameOnCard">Name on Card</label>
          <input type="text" id="nameOnCard" name="nameOnCard" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="expiry">Expiry Date</label>
            <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" required>
          </div>
          <div class="form-group">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
          </div>
        </div>
        <div class="form-errors" id="payment-errors"></div>
        <div class="panel-actions">
          <button type="button" class="btn btn-secondary" id="btn-back-shipping">Back to Shipping</button>
          <button type="submit" class="btn btn-primary">Review Order</button>
        </div>
      </form>
    </section>

    <!-- Step 5: Order Confirmation -->
    <section class="panel" id="step-confirm">
      <h2>Review & Place Order</h2>
      <div class="confirm-section">
        <h3>Order Items</h3>
        <div id="confirm-items"></div>
      </div>
      <div class="confirm-section">
        <h3>Shipping To</h3>
        <div id="confirm-shipping"></div>
      </div>
      <div class="confirm-section">
        <h3>Payment</h3>
        <div id="confirm-payment"></div>
      </div>
      <div class="confirm-section">
        <h3>Order Total</h3>
        <div id="confirm-totals"></div>
      </div>
      <div class="form-errors" id="order-errors"></div>
      <div class="panel-actions">
        <button class="btn btn-secondary" id="btn-back-payment">Back to Payment</button>
        <button class="btn btn-primary btn-large" id="btn-place-order">Place Order</button>
      </div>
    </section>

    <!-- Order Success -->
    <section class="panel" id="step-success">
      <div class="success-container">
        <div class="success-icon">&#10003;</div>
        <h2>Order Placed Successfully!</h2>
        <p class="order-id" id="success-order-id"></p>
        <p>A confirmation email has been sent to <span id="success-email"></span></p>
        <div class="panel-actions">
          <button class="btn btn-primary" id="btn-new-order">Start New Order</button>
        </div>
      </div>
    </section>
  </main>

  <script src="checkout.js"></script>
</body>
</html>
